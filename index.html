<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- חובה: גוגל מחזירה 404 כאשר בקשת השמע נשלחת עם כותרת Referer של הדף -->
    <meta name="referrer" content="no-referrer">
    <title>מקריא טקסט בעברית איכותית</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; text-align: center; }
        textarea { width: 100%; max-width: 600px; height: 150px; margin: 0 auto 15px; font-size: 16px; padding: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; display: block; font-family: inherit; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #0078d4; color: white; border: none; border-radius: 4px; font-weight: bold; margin: 0 4px; }
        button:hover { background: #005a9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { margin-top: 12px; color: #aaa; font-size: 14px; }
        .row { margin-top: 10px; }
        input[type=range] { width: 140px; vertical-align: middle; }
        .hint { margin-top: 18px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

    <h2>הקראת טקסט בעברית בקול טבעי (ללא הגבלה)</h2>

    <textarea id="textInput">שלום! הקוד הנוכחי משתמש כעת במנוע השמע הרשמי והאיכותי של גוגל. בצורה הזו, הקול יישמע טבעי וברור לחלוטין בכל דפדפן, ללא תלות בקול הרובוטי הישן של המחשב.</textarea>

    <div class="row">
        <button id="playBtn" onclick="toggleSpeak()">הקרא טקסט בקול טבעי</button>
        <button id="stopBtn" onclick="stopSpeak()">עצור</button>
    </div>

    <div class="row">
        <label>מהירות: <span id="speedLabel">1.0</span></label><br>
        <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1" oninput="document.getElementById('speedLabel').textContent = parseFloat(this.value).toFixed(1)">
    </div>

    <div id="statusLabel" class="status"></div>

    <div class="hint">ההקראה מבוצעת ממנוע השמע של Google Translate — נדרש חיבור לאינטרנט. אם הוא לא זמין, הדף עובר אוטומטית לקול המקומי של המכשיר.</div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        const MAX_CHARS = 190;
        const audioPlayer = document.getElementById('audioPlayer');
        const statusLabel = document.getElementById('statusLabel');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        let chunks = [];
        let currentIndex = 0;
        let isPlaying = false;

        function splitText(text) {
            text = text.replace(/\s+/g, ' ').trim();
            if (text.length <= MAX_CHARS) return [text];

            const parts = text.split(/(?<=[.!?։؟…])\s+/);
            const result = [];
            let buffer = '';

            for (const part of parts) {
                if ((buffer + ' ' + part).trim().length <= MAX_CHARS) {
                    buffer = (buffer ? buffer + ' ' : '') + part;
                    continue;
                }
                if (buffer) result.push(buffer);
                if (part.length <= MAX_CHARS) {
                    buffer = part;
                } else {
                    const words = part.split(' ');
                    buffer = '';
                    for (const word of words) {
                        if ((buffer ? buffer + ' ' : '') + word > MAX_CHARS) {
                            if (buffer) result.push(buffer);
                            buffer = word;
                        } else {
                            buffer = (buffer ? buffer + ' ' : '') + word;
                        }
                    }
                }
            }
            if (buffer) result.push(buffer);
            return result;
        }

        const CLIENTS = ['gwt-client', 'tw-ob', 'dict-chrome-ex'];

        function buildUrl(text, client) {
            const speed = parseFloat(document.getElementById('speedRange').value).toFixed(1);
            return 'https://translate.google.com/translate_tts'
                + '?ie=UTF-8'
                + '&client=' + client
                + '&tl=iw'
                + '&ttsspeed=' + speed
                + '&q=' + encodeURIComponent(text);
        }

        function resetBtn() {
            isPlaying = false;
            playBtn.textContent = 'הקרא טקסט בקול טבעי';
        }

        function fallbackLocal() {
            if (!('speechSynthesis' in window)) {
                statusLabel.textContent = 'שגיאה: לא ניתן להפעיל את מנוע השמע.';
                return;
            }
            const u = new SpeechSynthesisUtterance(document.getElementById('textInput').value);
            const rate = parseFloat(document.getElementById('speedRange').value);
            u.lang = 'he-IL';
            u.rate = rate;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
            statusLabel.textContent = 'מנוע גוגל לא זמין — מנגן בקול מקומי.';
        }

        async function fetchAudio(text) {
            let lastErr = null;
            for (const client of CLIENTS) {
                try {
                    const res = await fetch(buildUrl(text, client), { referrerPolicy: 'no-referrer' });
                    if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
                    const buf = await res.arrayBuffer();
                    if (buf.byteLength > 0) return buf;
                    lastErr = new Error('תשובה ריקה');
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('בקשה נכשלה');
        }

        async function playCurrentChunk() {
            if (!isPlaying) return;
            if (currentIndex >= chunks.length) {
                resetBtn();
                statusLabel.textContent = 'ההקראה הסתיימה.';
                return;
            }

            const isLast = currentIndex === chunks.length - 1;
            const indexAtStart = currentIndex;
            statusLabel.textContent = 'מכין את השמע... (' + (currentIndex + 1) + '/' + chunks.length + ')';

            let buf;
            try {
                buf = await fetchAudio(chunks[currentIndex]);
            } catch (err) {
                console.error('TTS fetch failed:', err);
                if (indexAtStart === 0) {
                    resetBtn();
                    fallbackLocal();
                } else {
                    resetBtn();
                    statusLabel.textContent = 'ההקראה נעצרה באמצע בגלל שגיאת רשת.';
                }
                return;
            }

            if (!isPlaying) return;

            const isLastNow = currentIndex === chunks.length - 1;
            statusLabel.textContent = 'מנגן... (' + (currentIndex + 1) + '/' + chunks.length + ')';

            audioPlayer.onended = function () {
                if (!isPlaying) return;
                if (isLastNow) {
                    resetBtn();
                    statusLabel.textContent = 'ההקראה הסתיימה.';
                } else {
                    currentIndex++;
                    playCurrentChunk();
                }
            };

            audioPlayer.onerror = function () {
                if (!isPlaying) return;
                resetBtn();
                statusLabel.textContent = 'שגיאה בניגון השמע. נסה שוב.';
            };

            audioPlayer.src = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));
            try {
                await audioPlayer.play();
            } catch (err) {
                console.error('play() failed:', err);
                resetBtn();
                statusLabel.textContent = 'שגיאה בניגון השמע. נסה שוב.';
            }
        }

        function toggleSpeak() {
            if (isPlaying) { stopSpeak(); return; }

            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('אנא הכנס טקסט להקראה');
                return;
            }

            chunks = splitText(text);
            currentIndex = 0;
            isPlaying = true;
            playBtn.textContent = 'עצור';
            statusLabel.textContent = 'מכין את השמע...';
            playCurrentChunk();
        }

        function stopSpeak() {
            isPlaying = false;
            window.speechSynthesis && window.speechSynthesis.cancel();
            audioPlayer.pause();
            audioPlayer.removeAttribute('src');
            audioPlayer.load();
            resetBtn();
            statusLabel.textContent = 'ההקראה הופסקה.';
        }
    </script>
</body>
</html>
